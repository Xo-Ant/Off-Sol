name: Build Android APK

on:
  push:
    branches: [ "main" ]
    # Pushing a tag like v1.0.0 also publishes the APK as a GitHub Release.
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create releases on tag pushes
    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        # Capacitor 8 CLI requires Node.js >= 22
        node-version: 22
        cache: 'npm'

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        # capacitor.build.gradle targets JavaVersion.VERSION_21
        java-version: '21'

    - name: Install dependencies
      run: npm ci

    - name: Build Web App
      run: npm run build

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Build APK
      run: cd android && ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Off-Sol-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Rename APK for release
      if: startsWith(github.ref, 'refs/tags/v')
      run: cp android/app/build/outputs/apk/debug/app-debug.apk "Off-Sol-${GITHUB_REF_NAME}.apk"

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: Off-Sol-${{ github.ref_name }}.apk
        # Tags like v1.0.0-beta.1 are marked as pre-releases.
        prerelease: ${{ contains(github.ref_name, '-') }}
        generate_release_notes: true
        body: |
          Debug-signed APK built by CI from ${{ github.sha }}.
          Install: download the .apk on your Android phone and allow "install from unknown sources".
