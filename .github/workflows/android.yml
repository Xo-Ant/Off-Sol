name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        # Capacitor 8 CLI requires Node.js >= 22
        node-version: 22
        cache: 'npm'

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        # capacitor.build.gradle targets JavaVersion.VERSION_21
        java-version: '21'

    - name: Install dependencies
      run: npm ci

    - name: Build Web App
      run: npm run build

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Build APK
      run: cd android && ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Off-Sol-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
